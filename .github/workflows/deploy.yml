name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Proyecto de Supabase EXPERIMENTAL (no el real). Llave pública/anon,
          # segura de exponer: está protegida por las políticas RLS del proyecto.
          VITE_SUPABASE_URL: https://vzcwporahatctqddphto.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6Y3dwb3JhaGF0Y3RxZGRwaHRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODU2ODAsImV4cCI6MjEwMDU2MTY4MH0.2eUVt9PvHooLM10Qd45UIQG3howKupfm9T3SlUZgT0Q
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
